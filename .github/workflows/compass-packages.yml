name: Compass packages

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint and format
        run: npm run check

      - name: Typecheck compass-ui
        run: npm run typecheck --workspace=@mattermost/compass-ui

      - name: Test compass-ui
        run: npm test --workspace=@mattermost/compass-ui

      # Also verifies the token snapshot and cascade layering.
      - name: Build compass-ui
        run: npm run build --workspace=@mattermost/compass-ui

      - name: Build compass-proto
        run: npm run build --workspace=@mattermost/compass-proto

      - name: Smoke test packages
        run: npm run smoke-test:packages
