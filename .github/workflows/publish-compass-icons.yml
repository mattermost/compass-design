name: Publish compass-icons

# Ship @mattermost/compass-icons when a GitHub Release is published.
# Tag format: compass-icons@<version> (e.g. compass-icons@0.1.64)
on:
  release:
    types: [published]

permissions:
  id-token: write # npm OIDC trusted publishing
  contents: read

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'compass-icons@')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # Do not set registry-url: it writes .npmrc with an empty
          # NODE_AUTH_TOKEN and npm then skips OIDC trusted-publisher auth.

      - name: Install npm with trusted publishing support
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - run: npm ci

      - name: Resolve version and dist-tag
        id: meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./packages/compass-icons/package.json').version")
          tag_name="$RELEASE_TAG"
          release_version="${tag_name#compass-icons@}"

          if [ "$version" != "$release_version" ]; then
            echo "::error::Release tag ($tag_name) does not match packages/compass-icons version ($version)"
            exit 1
          fi

          if [[ "$version" == *"-alpha"* ]]; then
            dist_tag=alpha
          elif [[ "$version" == *"-beta"* ]]; then
            dist_tag=beta
          else
            dist_tag=latest
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "Publishing @mattermost/compass-icons@$version with --tag $dist_tag"

      - name: Build compass-icons (including Fontello)
        run: npm run build:icons:font

      - name: Skip if version already on npm
        id: check
        run: |
          version="${{ steps.meta.outputs.version }}"
          on_reg=$(npm view "@mattermost/compass-icons@$version" version 2>/dev/null || true)
          if [ "$on_reg" = "$version" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $version is already on npm — skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.exists != 'true'
        working-directory: ./packages/compass-icons/build
        run: >
          npm publish
          --access public
          --tag ${{ steps.meta.outputs.dist_tag }}
          --provenance
